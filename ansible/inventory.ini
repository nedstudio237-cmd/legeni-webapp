# Option A du sujet : une seule VM porte Jenkins (conteneur) et Minikube.
# Pour une autre machine : remplacer ansible_connection=local par ansible_host=<IP> ansible_user=<utilisateur>.
[cicd]
devops-vm ansible_connection=local ansible_user=romaric

[cicd:vars]
# Volume déjà utilisé par le Jenkins des TP (conservé : jobs, credentials, historique)
jenkins_volume=devops-tp_jenkins_home
