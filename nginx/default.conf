# Reverse proxy devant les réplicas du service "web".
# 127.0.0.11 = DNS interne de Docker. Avec une variable dans proxy_pass,
# nginx re-résout "web" régulièrement : les réplicas ajoutés par
# "docker compose up --scale web=N" sont pris en compte sans redémarrage.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    location / {
        set $backend http://web:5000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
