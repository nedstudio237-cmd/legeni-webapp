# Stack complète de l'application fil rouge (référence du TP 2.8)
#   docker compose up -d --build
#   docker compose up -d --scale web=3
name: legeni

services:
  web:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: ${DOCKERHUB_ID:-legeni}/legeni-webapp:${APP_VERSION:-dev}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_COLOR: ${APP_COLOR:-#1f6feb}
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend, frontend]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [backend]

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped
    networks: [frontend]

volumes:
  redis_data:

networks:
  frontend:
  backend:
