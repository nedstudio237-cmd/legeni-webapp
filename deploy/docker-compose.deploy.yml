# Déploiement d'un environnement (staging ou prod) par Jenkins – TP 3.8
#   IMAGE_REF=legeni/legeni-webapp:1.0.12 APP_ENV=staging PORT=8081 REDIS_PASSWORD=... \
#     docker compose -p legeni-staging -f deploy/docker-compose.deploy.yml up -d --wait
# Pas de bind mount : le fichier fonctionne aussi lorsqu'il est lancé depuis le conteneur Jenkins.
services:
  web:
    image: ${IMAGE_REF:?IMAGE_REF requis}
    environment:
      APP_ENV: ${APP_ENV:-staging}
      APP_COLOR: ${APP_COLOR:-#bf8700}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD requis}
    ports:
      - "${PORT:-8081}:5000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
